name: Tests

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev" ]

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo, pdo_pgsql, bcmath, zip, xml, dom, gd, fileinfo, exif
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r "file_put_contents('.env', PHP_EOL.'DB_CONNECTION=pgsql'.PHP_EOL.'DB_HOST=127.0.0.1'.PHP_EOL.'DB_PORT=5432'.PHP_EOL.'DB_DATABASE=dms_test'.PHP_EOL.'DB_USERNAME=postgres'.PHP_EOL.'DB_PASSWORD=postgres'.PHP_EOL, FILE_APPEND);"
          php artisan migrate --force

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dms_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
